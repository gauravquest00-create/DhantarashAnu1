<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f0409">
<title>Happy Dhanteras, ANU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #3d0a16;
    --maroon-deep: #1f0409;
    --marigold: #f5b82e;
    --saffron: #ff8c42;
    --ivory: #fff6e6;
    --muted: rgba(255, 246, 230, 0.72);
    --line: rgba(245, 184, 46, 0.35);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans); font-weight: 400; color: var(--ivory);
    background:
      radial-gradient(circle at 75% 20%, rgba(255,140,66,0.18), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(245,184,46,0.12), transparent 40%),
      linear-gradient(160deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding:
      calc(var(--safe-t) + clamp(12px, 3vh, 28px))
      calc(var(--safe-r) + clamp(12px, 4vw, 24px))
      calc(var(--safe-b) + clamp(12px, 3vh, 24px))
      calc(var(--safe-l) + clamp(12px, 4vw, 24px));
  }

  /* ---------- Intro ---------- */
  .intro { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .intro .panel { position: absolute; top: 0; height: 100%; width: 50%; background: var(--maroon-deep); transition: transform 1.3s var(--ease-out); }
  .intro .panel.left { left: 0; }
  .intro .panel.right { right: 0; }
  .intro.open .panel.left { transform: translateX(-100%); }
  .intro.open .panel.right { transform: translateX(100%); }
  .intro.gone { display: none; }
  .spark-line {
    position: absolute; height: 1px; width: 0; top: 50%; left: 50%; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--marigold), transparent);
    animation: lineGrow 1.2s var(--ease-out) 0.3s forwards;
  }
  @keyframes lineGrow { to { width: min(70vw, 600px); } }
  .intro-flame {
    position: absolute; left: 50%; top: 50%; width: 22px; height: 34px;
    transform: translate(-50%, -50%) scale(0); opacity: 0;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 80%, #fff7c2, var(--marigold) 55%, transparent);
    box-shadow: 0 0 60px 20px rgba(245,184,46,0.35);
    animation: ignite 1s var(--ease-spring) 1.1s forwards;
  }
  @keyframes ignite { to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .skip {
    position: absolute; right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 16px); pointer-events: auto;
    font: inherit; font-size: 0.78rem; color: var(--muted); background: transparent;
    border: 1px solid rgba(255,246,230,0.25); border-radius: 999px; padding: 8px 16px; cursor: pointer;
    opacity: 0; animation: fade 0.8s ease 0.6s forwards;
  }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- Frame: everything lives inside it ---------- */
  .frame {
    width: 100%; max-width: 680px; margin: auto;
    padding: clamp(22px, 5vw, 40px) clamp(16px, 5vw, 36px) clamp(18px, 4vw, 28px);
    border: 1px solid var(--line); border-radius: clamp(20px, 4vw, 28px);
    background: rgba(255,246,230,0.03);
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; gap: clamp(18px, 3.5vh, 24px);
    text-align: center;
  }

  header.top {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px;
    font-size: clamp(0.62rem, 2.6vw, 0.78rem); letter-spacing: 0.2em; text-transform: uppercase; color: var(--marigold);
  }
  .top .pill { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--muted); letter-spacing: 0.12em; }

  .layout { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 3.5vh, 24px); width: 100%; }
  .main-hero { width: 100%; display: flex; flex-direction: column; align-items: center; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(16px); filter: blur(4px); animation: reveal 1s var(--ease-out) forwards; }
  .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.55s; } .d4 { animation-delay: 0.8s; }
  @keyframes reveal { to { opacity: 1; transform: none; filter: blur(0); } }

  .eyebrow { font-size: clamp(0.62rem, 2.4vw, 0.78rem); letter-spacing: 0.28em; text-transform: uppercase; color: var(--saffron); margin: 0 0 4px; }

  /* Name */
  .name {
    display: flex; justify-content: center; gap: 0.03em; margin: 0; padding: 0;
    background: none; border: 0; cursor: pointer; max-width: 100%;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .name:focus-visible { outline: 2px solid var(--marigold); outline-offset: 10px; border-radius: 8px; }
  .letter {
    display: inline-block; font-family: var(--serif); font-weight: 700; line-height: 1;
    font-size: clamp(4.5rem, 26vw, 11rem);
    background: linear-gradient(180deg, #fff1c7 0%, var(--marigold) 60%, var(--saffron) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    opacity: 0; transform: translateY(40px) scale(0.85); will-change: transform, opacity;
  }
  .main-started .letter { animation: letterIn 1s var(--ease-spring) forwards; }
  .main-started .letter:nth-child(1) { animation-delay: 0.45s; }
  .main-started .letter:nth-child(2) { animation-delay: 0.6s; }
  .main-started .letter:nth-child(3) { animation-delay: 0.75s; }
  @keyframes letterIn { to { opacity: 1; transform: none; } }

  .tagline { font-family: var(--serif); font-style: italic; font-size: clamp(1.15rem, 4.5vw, 1.7rem); line-height: 1.25; color: var(--marigold); margin: 6px 0 0; }
  .lead { color: var(--muted); font-size: clamp(0.88rem, 3.4vw, 0.98rem); line-height: 1.6; max-width: 44ch; margin: 0 auto; }

  .btn {
    font: inherit; font-size: 0.88rem; font-weight: 500; color: var(--maroon-deep); cursor: pointer;
    background: linear-gradient(var(--marigold), var(--saffron)); border: 0; border-radius: 999px;
    padding: 13px 24px; min-height: 46px; width: min(100%, 320px);
    box-shadow: 0 8px 24px rgba(245,184,46,0.25);
    transition: transform 0.2s var(--ease-out), box-shadow 0.3s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(245,184,46,0.35); }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn:focus-visible { outline: 2px solid var(--ivory); outline-offset: 3px; }

  /* Arch panel */
  .arch {
    position: relative; width: 100%; max-width: 420px;
    border-radius: 999px 999px 24px 24px / 200px 200px 24px 24px;
    padding: clamp(36px, 8vw, 48px) clamp(12px, 4vw, 28px) clamp(18px, 4vw, 26px);
    border: 1px solid var(--line); background: rgba(255,246,230,0.04);
    box-shadow: inset 0 0 60px rgba(245,184,46,0.06);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .arch::before {
    content: ""; position: absolute; inset: 10px;
    border-radius: 999px 999px 16px 16px / 190px 190px 16px 16px;
    border: 1px dashed rgba(245,184,46,0.18); pointer-events: none;
  }
  .arch-title { font-family: var(--serif); font-size: clamp(1.25rem, 5vw, 1.45rem); margin: 0 0 2px; color: var(--ivory); }
  .arch-sub { font-size: clamp(0.72rem, 3vw, 0.8rem); color: var(--muted); margin: 0 0 18px; }

  .diya-row { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 2.6vw, 14px); }
  .diya {
    width: clamp(40px, 11vw, 48px); height: clamp(44px, 12vw, 52px); position: relative;
    cursor: pointer; background: none; border: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    transition: transform 0.25s var(--ease-out);
  }
  .diya:hover { transform: translateY(-3px); }
  .diya:active { transform: scale(0.94); }
  .diya:focus-visible { outline: 2px solid var(--marigold); outline-offset: 4px; border-radius: 10px; }
  .diya .bowl {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 84%; height: 27%; border-radius: 0 0 50% 50%;
    background: linear-gradient(#f5b82e, #7a3b12);
  }
  .diya .fl {
    position: absolute; bottom: 40%; left: 50%; width: 26%; height: 42%;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 80%, #fff7c2, var(--saffron) 55%, transparent);
    transform: translateX(-50%) scale(0.2); opacity: 0;
    transition: transform 0.8s var(--ease-spring), opacity 0.6s ease;
  }
  .diya .ring {
    position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid var(--marigold); transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none;
  }
  .diya.on .fl { opacity: 1; transform: translateX(-50%) scale(1); animation: flick 0.6s ease-in-out 0.8s infinite alternate; }
  .diya.on .bowl { box-shadow: 0 0 18px rgba(245,184,46,0.5); }
  .diya.on::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,179,71,0.4), transparent 70%);
    animation: halo 2.4s ease-in-out infinite alternate; pointer-events: none;
  }
  .diya.pop .ring { animation: ring 0.9s var(--ease-out) forwards; }
  .diya.pop .bowl { animation: bowlPop 0.5s var(--ease-spring); }
  @keyframes flick { from { transform: translateX(-50%) scale(1, 0.92); } to { transform: translateX(-50%) scale(0.92, 1.08); } }
  @keyframes halo { from { opacity: 0.5; transform: scale(0.9); } to { opacity: 1; transform: scale(1.15); } }
  @keyframes ring { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.9; } 100% { transform: translate(-50%, -50%) scale(3); opacity: 0; } }
  @keyframes bowlPop { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.15, 0.85); } 100% { transform: translateX(-50%) scale(1); } }

  .dots { display: flex; gap: 8px; margin: 14px 0 16px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,246,230,0.22); transition: background 0.5s ease, transform 0.5s var(--ease-spring); }
  .dot.on { background: var(--marigold); transform: scale(1.4); }

  .message-wrap { position: relative; width: 100%; min-height: 5.6em; }
  .message {
    position: absolute; inset: 0; margin: 0; font-family: var(--serif);
    font-size: clamp(1.05rem, 4.2vw, 1.2rem); line-height: 1.5; color: var(--ivory);
    opacity: 0; transform: translateY(10px); filter: blur(3px);
    transition: opacity 0.7s ease, transform 0.7s var(--ease-out), filter 0.7s ease;
    cursor: pointer; text-wrap: balance;
  }
  .message.active { opacity: 1; transform: none; filter: blur(0); }

  footer {
    width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    font-size: clamp(0.7rem, 3vw, 0.78rem); color: var(--muted);
  }
  .hint { font-size: 0.72rem; color: var(--muted); }
  .reset {
    font: inherit; font-size: 0.78rem; color: var(--ivory); background: transparent; cursor: pointer;
    border: 1px solid rgba(255,246,230,0.3); border-radius: 999px; padding: 8px 16px; min-height: 36px;
    touch-action: manipulation;
  }
  .reset:hover { border-color: var(--marigold); }

  /* Confetti */
  .confetti {
    position: fixed; top: -24px; width: 9px; height: 13px; pointer-events: none; z-index: 40; border-radius: 2px;
    animation: fall var(--dur) cubic-bezier(.3,.5,.6,1) forwards;
  }
  @keyframes fall {
    0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 1; }
    50% { transform: translate3d(var(--sway), 50vh, 0) rotate(360deg); }
    100% { transform: translate3d(calc(var(--sway) * -0.4), 110vh, 0) rotate(720deg); opacity: 0; }
  }

  /* ---------- Size tiers ---------- */
  /* Very small phones (≈320–360px) */
  @media (max-width: 360px) {
    .arch { padding-left: 10px; padding-right: 10px; }
    .diya-row { gap: 6px; }
    .btn { width: 100%; }
    .reset { padding: 7px 12px; }
  }
  /* Standard phones (iPhone 17, 390–430px) and up */
  @media (min-width: 390px) and (max-width: 767px) {
    .btn { width: min(100%, 300px); }
  }
  /* Tablets and desktops: two-up layout for the hero and arch */
  @media (min-width: 768px) {
    .layout { flex-direction: row; justify-content: center; align-items: center; gap: 40px; }
    .main-hero { width: auto; flex: 1; align-items: center; }
    .arch { flex: 0 0 380px; max-width: 380px; }
    .btn { width: auto; }
  }
  @media (min-width: 768px) and (max-height: 500px) {
    .frame { padding-top: 20px; padding-bottom: 16px; }
  }

  /* Short landscape phones */
  @media (max-height: 480px) and (orientation: landscape) {
    body { justify-content: center; }
    .layout { flex-direction: row; gap: 24px; }
    .arch { max-width: 320px; flex: 0 0 320px; }
    .letter { font-size: clamp(3.5rem, 18vh, 6rem); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="panel left"></div>
    <div class="panel right"></div>
    <div class="spark-line"></div>
    <div class="intro-flame"></div>
    <button class="skip" id="skip">Skip intro</button>
  </div>

  <div class="frame">
    <header class="top reveal d1">
      <span>Shubh Dhanteras</span>
      <span class="pill">With love</span>
    </header>

    <div class="layout" id="main">
      <section class="main-hero">
        <p class="eyebrow reveal d2">A celebration for</p>
        <button class="name" id="name" aria-label="Celebrate ANU with confetti">
          <span class="letter">A</span><span class="letter">N</span><span class="letter">U</span>
        </button>
        <p class="tagline reveal d3">May your year shine as brightly as these lights</p>
        <p class="lead reveal d3">Tap each diya below to light it, and let each blessing glow. Tap the name for a little surprise.</p>
        <div class="reveal d4" style="margin-top: clamp(14px, 3vh, 20px);">
          <button class="btn" id="lightAllBtn">Light all diyas</button>
        </div>
      </section>

      <aside class="arch reveal d4" aria-label="Diya lighting">
        <h2 class="arch-title">Your evening lamps</h2>
        <p class="arch-sub">Tap a diya to light it</p>
        <div class="diya-row" id="diyaRow"></div>
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="message-wrap">
          <p class="message active" id="message" aria-live="polite">Tap the diyas to light up your evening.</p>
        </div>
      </aside>
    </div>

    <footer class="reveal d4">
      <span class="hint">Press R to reset</span>
      <button class="reset" id="resetBtn">Reset</button>
    </footer>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const intro = $("intro"), main = $("main");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TOTAL = 5;
  const messages = [
    "Wishing you health, happiness, and prosperity, ANU.",
    "May Goddess Lakshmi bless every step you take, ANU.",
    "Here's to new beginnings and golden moments, ANU.",
    "May your home be filled with laughter and light, ANU.",
    "Shine bright, dream big, and celebrate yourself, ANU!"
  ];
  const finale = "Happy Dhanteras, ANU! Your light is shining everywhere.";
  const idle = "Tap the diyas to light up your evening.";
  const colors = ["#f5b82e", "#ff8c42", "#fff1c7", "#ffd37a", "#e8557a"];
  let lit = 0, msgTimer;

  // Intro: curtain splits after the flame ignites
  function revealMain() {
    main.classList.add("main-started");
    intro.classList.add("open");
    setTimeout(() => intro.classList.add("gone"), 1400);
  }
  if (reduceMotion) { intro.classList.add("gone"); main.classList.add("main-started"); }
  else setTimeout(revealMain, 2600);
  $("skip").addEventListener("click", () => { if (reduceMotion) intro.classList.add("gone"); else revealMain(); });

  // Diyas and progress dots
  const diyaRow = $("diyaRow"), dotsEl = $("dots");
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement("button");
    d.className = "diya";
    d.setAttribute("aria-label", "Light diya " + (i + 1));
    d.innerHTML = '<span class="ring"></span><span class="fl"></span><span class="bowl"></span>';
    d.addEventListener("click", () => light(d));
    diyaRow.appendChild(d);
    const dot = document.createElement("span");
    dot.className = "dot";
    dotsEl.appendChild(dot);
  }

  function light(d) {
    if (d.classList.contains("on")) return;
    d.classList.add("on", "pop");
    setTimeout(() => d.classList.remove("pop"), 1000);
    dotsEl.children[lit].classList.add("on");
    lit++;
    setMessage(messages[lit - 1]);
    burst(reduceMotion ? 0 : 28);
    if (lit === TOTAL) setTimeout(() => { setMessage(finale); burst(reduceMotion ? 0 : 90); }, 500);
  }

  function lightAll() {
    [...diyaRow.children].forEach((d, i) => setTimeout(() => light(d), i * 150));
  }

  function setMessage(text) {
    const el = $("message");
    if (el.textContent === text) return;
    el.classList.remove("active");
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.textContent = text; el.classList.add("active"); }, 250);
  }

  function reset() {
    lit = 0;
    [...diyaRow.children].forEach((d) => d.classList.remove("on", "pop"));
    [...dotsEl.children].forEach((d) => d.classList.remove("on"));
    setMessage(idle);
  }

  // Name bounce + confetti; the message also triggers it
  function celebrateName() {
    document.querySelectorAll(".letter").forEach((s, i) => {
      s.animate(
        [{ transform: "translateY(0) scale(1)" }, { transform: "translateY(-22px) scale(1.05)", offset: 0.3 },
         { transform: "translateY(-5px) scale(0.99)", offset: 0.6 }, { transform: "translateY(0) scale(1)" }],
        { duration: 800, delay: i * 110, easing: "cubic-bezier(.34,1.56,.64,1)" }
      );
    });
    burst(reduceMotion ? 0 : 60);
  }
  $("name").addEventListener("click", celebrateName);
  $("message").addEventListener("click", celebrateName);
  $("lightAllBtn").addEventListener("click", lightAll);
  $("resetBtn").addEventListener("click", reset);
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r" && !e.metaKey && !e.ctrlKey) reset();
  });

  function burst(count) {
    for (let i = 0; i < count; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.setProperty("--dur", (2.6 + Math.random() * 2) + "s");
      c.style.setProperty("--sway", (Math.random() * 80 - 40) + "px");
      document.body.appendChild(c);
      c.addEventListener("animationend", () => c.remove());
    }
  }
</script>
</body>
</html>
